<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm w-100" style="max-width: 400px;">
      <div class="card-body p-4">
        <h1 class="h3 text-center mb-4">Iniciar sesión</h1>
        <form method="post" action="">
          <!-- Token de seguridad de Django -->
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario o correo</label>
            <input type="text" class="form-control" id="usuario" name="usuario" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="recordar" name="recordar">
            <label class="form-check-label" for="recordar">Recordarme</label>
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <!-- Enlace corregido para volver al inicio -->
        <p class="text-center small mt-3 mb-0"><a href="{% url 'inicio' %}">Volver al inicio</a></p>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
